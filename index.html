<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="이미지와 외부 링크를 함께 비교하는 이상형 월드컵" />
  <title>링크 월드컵</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">IDEAL WORLD CUP</p>
        <h1>링크 월드컵</h1>
      </div>
      <button id="manageButton" class="secondary-button" type="button">후보 관리</button>
    </div>
  </header>

  <main class="shell">
    <section id="homeView" class="panel">
      <div class="hero-copy">
        <span class="badge">이미지 + 사이트 링크</span>
        <h2>두 후보를 비교하고 하나를 선택하세요.</h2>
        <p>후보 카드는 선택에 사용하고, <strong>사이트 보기</strong> 버튼은 선택 처리 없이 새 탭으로 열립니다.</p>
      </div>

      <div class="home-actions">
        <button id="startButton" class="primary-button large" type="button">월드컵 시작</button>
        <button id="resumeButton" class="secondary-button large hidden" type="button">진행 중인 게임 이어하기</button>
      </div>

      <div class="summary-card">
        <div>
          <span class="summary-label">등록 후보</span>
          <strong id="candidateCount">0명</strong>
        </div>
        <div>
          <span class="summary-label">대진 방식</span>
          <strong>무작위</strong>
        </div>
        <div>
          <span class="summary-label">홀수 후보</span>
          <strong>자동 부전승</strong>
        </div>
      </div>
    </section>

    <section id="manageView" class="panel hidden">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CANDIDATES</p>
          <h2>후보 관리</h2>
        </div>
        <button id="backHomeButton" class="secondary-button" type="button">돌아가기</button>
      </div>

      <form id="candidateForm" class="candidate-form">
        <label>
          후보 이름
          <input id="nameInput" required maxlength="60" placeholder="예: 대부도 OO펜션" />
        </label>
        <label>
          이미지 주소
          <input id="imageInput" required type="url" placeholder="https://..." />
        </label>
        <label>
          사이트 주소
          <input id="urlInput" required type="url" placeholder="https://..." />
        </label>
        <button class="primary-button" type="submit">후보 추가</button>
      </form>

      <div class="manage-toolbar">
        <p>최소 2명의 후보가 필요합니다. 등록 내용은 이 브라우저에 저장됩니다.</p>
        <div class="toolbar-buttons">
          <button id="restoreSamplesButton" class="secondary-button" type="button">샘플 복원</button>
          <button id="clearCandidatesButton" class="danger-button" type="button">전체 삭제</button>
        </div>
      </div>

      <div id="candidateList" class="candidate-list"></div>
    </section>

    <section id="gameView" class="game-view hidden" aria-live="polite">
      <div class="game-topbar">
        <button id="quitButton" class="secondary-button" type="button">처음으로</button>
        <div class="round-copy">
          <span id="roundLabel" class="round-label">8강</span>
          <span id="matchProgress" class="match-progress">1 / 4</span>
        </div>
        <button id="restartButton" class="secondary-button" type="button">다시 섞기</button>
      </div>

      <div class="versus-layout">
        <article id="leftCandidate" class="battle-card" tabindex="0" role="button" aria-label="왼쪽 후보 선택"></article>
        <div class="versus-mark" aria-hidden="true">VS</div>
        <article id="rightCandidate" class="battle-card" tabindex="0" role="button" aria-label="오른쪽 후보 선택"></article>
      </div>
      <p class="game-hint">카드 선택 = 승자 결정 · 사이트 보기 = 외부 페이지 확인</p>
    </section>

    <section id="resultView" class="panel result-panel hidden">
      <p class="eyebrow">WINNER</p>
      <h2>최종 우승</h2>
      <div id="winnerCard" class="winner-card"></div>
      <div class="result-actions">
        <button id="playAgainButton" class="primary-button large" type="button">같은 후보로 다시 하기</button>
        <button id="resultHomeButton" class="secondary-button large" type="button">처음으로</button>
      </div>
      <div class="history-wrap">
        <h3>선택 기록</h3>
        <div id="historyList" class="history-list"></div>
      </div>
    </section>
  </main>

  <template id="candidateCardTemplate">
    <div class="candidate-row">
      <img alt="" />
      <div class="candidate-row-copy">
        <strong></strong>
        <a target="_blank" rel="noopener noreferrer">사이트 보기 ↗</a>
      </div>
      <button class="remove-button" type="button">삭제</button>
    </div>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
