<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="이미지와 외부 링크를 함께 비교하는 이상형 월드컵" />
  <title>이상형 월드컵</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button id="brandHomeButton" class="brand" type="button" aria-label="홈으로">
        <span class="brand-mark">W</span>
        <span>이상형 월드컵</span>
      </button>
      <nav class="header-nav" aria-label="주요 메뉴">
        <button id="headerHomeButton" class="nav-button" type="button">월드컵 시작</button>
        <button id="manageButton" class="nav-button" type="button">후보 관리</button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section id="homeView" class="home-view">
      <div class="start-card">
        <div class="trophy" aria-hidden="true">♛</div>
        <h1>이상형 월드컵</h1>
        <p class="start-description">두 후보 중 더 마음에 드는 곳을 선택하세요.</p>

        <div class="round-summary">
          <span>총 후보</span>
          <strong id="candidateCount">0명</strong>
        </div>
        <p class="round-note">등록된 후보가 무작위로 대결합니다. 홀수 후보는 자동 부전승 처리됩니다.</p>

        <div class="home-actions">
          <button id="startButton" class="primary-button wide" type="button">시작하기</button>
          <button id="resumeButton" class="secondary-button wide hidden" type="button">진행 중인 월드컵 이어하기</button>
        </div>
        <button id="homeManageButton" class="text-button" type="button">후보 이미지 · 사이트 링크 관리</button>
      </div>
    </section>

    <section id="manageView" class="manage-view hidden">
      <div class="manage-panel">
        <div class="section-heading">
          <div>
            <span class="section-kicker">CANDIDATES</span>
            <h2>후보 관리</h2>
          </div>
          <button id="backHomeButton" class="secondary-button" type="button">돌아가기</button>
        </div>

        <form id="candidateForm" class="candidate-form">
          <label>
            후보 이름
            <input id="nameInput" required maxlength="60" placeholder="예: 대부도 OO펜션" />
          </label>
          <label>
            이미지 주소
            <input id="imageInput" required type="url" placeholder="https://..." />
          </label>
          <label>
            사이트 주소
            <input id="urlInput" required type="url" placeholder="https://..." />
          </label>
          <button class="primary-button" type="submit">후보 추가</button>
        </form>

        <div class="manage-toolbar">
          <p>이미지를 눌러 선택하고, 사이트 버튼은 선택 처리 없이 새 탭으로 열립니다.</p>
          <div class="toolbar-buttons">
            <button id="restoreSamplesButton" class="secondary-button" type="button">샘플 복원</button>
            <button id="clearCandidatesButton" class="danger-button" type="button">전체 삭제</button>
          </div>
        </div>
        <div id="candidateList" class="candidate-list"></div>
      </div>
    </section>

    <section id="gameView" class="game-view hidden" aria-live="polite">
      <div class="game-heading">
        <div class="game-title-row">
          <h2>이상형 월드컵</h2>
          <div class="game-status"><strong id="roundLabel">8강</strong><span id="matchProgress">1 / 4</span></div>
        </div>
        <div class="game-tools">
          <button id="quitButton" type="button">처음으로</button>
          <span></span>
          <button id="restartButton" type="button">다시 섞기</button>
        </div>
      </div>

      <div id="battleStage" class="battle-stage">
        <article id="leftCandidate" class="battle-card left-card" tabindex="0" role="button" aria-label="왼쪽 후보 선택"></article>
        <div id="versusMark" class="versus-mark" aria-hidden="true">VS</div>
        <article id="rightCandidate" class="battle-card right-card" tabindex="0" role="button" aria-label="오른쪽 후보 선택"></article>
        <div id="choiceFlash" class="choice-flash" aria-hidden="true"></div>
      </div>
      <p class="game-hint">사진을 누르면 선택 · <b>사이트 보기</b>는 후보 페이지를 새 탭으로 엽니다.</p>
    </section>

    <section id="resultView" class="result-view hidden">
      <div class="result-panel">
        <div class="trophy winner-trophy" aria-hidden="true">♛</div>
        <span class="section-kicker">WINNER</span>
        <h2>최종 우승</h2>
        <div id="winnerCard" class="winner-card"></div>
        <div class="result-actions">
          <button id="playAgainButton" class="primary-button" type="button">다시 하기</button>
          <button id="resultHomeButton" class="secondary-button" type="button">처음으로</button>
        </div>
        <div class="history-wrap">
          <h3>선택 기록</h3>
          <div id="historyList" class="history-list"></div>
        </div>
      </div>
    </section>
  </main>

  <template id="candidateCardTemplate">
    <div class="candidate-row">
      <img alt="" />
      <div class="candidate-row-copy">
        <strong></strong>
        <a target="_blank" rel="noopener noreferrer">사이트 보기 ↗</a>
      </div>
      <button class="remove-button" type="button">삭제</button>
    </div>
  </template>

  <script src="candidates.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
