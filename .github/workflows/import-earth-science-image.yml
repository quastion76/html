name: Import Earth Science image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-earth-science-image.yml'

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        run: |
          mkdir -p assets/notion
          curl -fL 'https://cdn.imagetourls.com/uploads/tyImg/rJtY9up2.jpg' -o assets/notion/earth-science-2026-09-05-18.jpg
      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/notion/earth-science-2026-09-05-18.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add Earth Science problem image [skip ci]'
          git push
